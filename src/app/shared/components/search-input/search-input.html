<div class="relative">
  <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-sm">
    {{ icon() }}
  </span>
  <input
    type="text"
    [placeholder]="placeholder()"
    [(ngModel)]="value"
    class="w-full pl-10 pr-4 py-2 border border-outline-variant rounded-lg text-sm outline-none transition-all focus:ring-2 focus:ring-primary/30 focus:border-primary"
  />
</div>
