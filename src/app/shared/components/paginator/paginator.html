@if (totalPages() > 1) {
  <div class="flex flex-wrap items-center justify-between gap-4 px-6 py-4 bg-surface-container-low border-t border-outline-variant">
    <span class="text-sm text-on-surface-variant">
      Página <span class="font-bold text-on-surface">{{ currentPage() }}</span>
      de <span class="font-bold text-on-surface">{{ totalPages() }}</span>
      — <span class="font-bold text-on-surface">{{ totalElements() }}</span> {{ entityLabel() }}
    </span>

    <div class="flex items-center gap-1">
      <button
        type="button"
        [disabled]="currentPage() === 1"
        (click)="pageChange.emit(1)"
        class="flex items-center justify-center w-9 h-9 text-on-surface-variant rounded-lg transition-colors hover:bg-surface-container-high hover:text-primary disabled:opacity-30"
      >
        <span class="material-symbols-outlined text-lg">first_page</span>
      </button>
      <button
        type="button"
        [disabled]="currentPage() === 1"
        (click)="pageChange.emit(currentPage() - 1)"
        class="flex items-center justify-center w-9 h-9 text-on-surface-variant rounded-lg transition-colors hover:bg-surface-container-high hover:text-primary disabled:opacity-30"
      >
        <span class="material-symbols-outlined text-lg">chevron_left</span>
      </button>

      @for (item of pageNumbers(); track $index) {
        @if (item === 'ellipsis') {
          <span class="w-9 h-9 flex items-center justify-center text-on-surface-variant">…</span>
        } @else {
          <button
            type="button"
            (click)="pageChange.emit(item)"
            class="flex items-center justify-center w-9 h-9 rounded-lg text-sm font-bold transition-colors"
            [class.bg-primary]="item === currentPage()"
            [class.text-white]="item === currentPage()"
            [class.shadow-sm]="item === currentPage()"
            [class.text-on-surface-variant]="item !== currentPage()"
            [class.hover:bg-primary/10]="item !== currentPage()"
            [class.hover:text-primary]="item !== currentPage()"
          >
            {{ item }}
          </button>
        }
      }

      <button
        type="button"
        [disabled]="currentPage() >= totalPages()"
        (click)="pageChange.emit(currentPage() + 1)"
        class="flex items-center justify-center w-9 h-9 text-on-surface-variant rounded-lg transition-colors hover:bg-surface-container-high hover:text-primary disabled:opacity-30"
      >
        <span class="material-symbols-outlined text-lg">chevron_right</span>
      </button>
      <button
        type="button"
        [disabled]="currentPage() >= totalPages()"
        (click)="pageChange.emit(totalPages())"
        class="flex items-center justify-center w-9 h-9 text-on-surface-variant rounded-lg transition-colors hover:bg-surface-container-high hover:text-primary disabled:opacity-30"
      >
        <span class="material-symbols-outlined text-lg">last_page</span>
      </button>
    </div>
  </div>
}
