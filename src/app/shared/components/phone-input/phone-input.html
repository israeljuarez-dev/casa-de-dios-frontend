<div class="flex gap-2">
  <div class="w-32">
    <app-select [options]="countryOptions" [(value)]="dialCode" placeholder="País" />
  </div>

  <input
    #phoneInputRef
    type="tel"
    [placeholder]="placeholder()"
    [ngModel]="displayValue()"
    (ngModelChange)="onPhoneNumberInput($event)"
    class="flex-1 px-4 py-2.5 bg-white rounded-xl text-sm outline-none transition-all focus:ring-4"
    [class.border]="true"
    [class.border-outline-variant]="isValid()"
    [class.border-error]="!isValid()"
    [class.focus:border-primary]="isValid()"
    [class.focus:ring-primary/10]="isValid()"
    [class.focus:border-error]="!isValid()"
    [class.focus:ring-error/10]="!isValid()"
  />
</div>

@if (hasLetters()) {
  <p class="text-xs font-bold text-error ml-1 mt-1.5">Solo se permiten números.</p>
} @else if (hasReachedLimit()) {
  <p class="text-xs font-bold text-error ml-1 mt-1.5">
    Se permite un máximo de {{ expectedDigits() }} dígitos para este país.
  </p>
} @else if (validationMessage(); as message) {
  <p class="text-xs font-bold text-error ml-1 mt-1.5">{{ message }}</p>
}
