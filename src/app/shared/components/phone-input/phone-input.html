<div class="flex gap-2">
  <select
    [ngModel]="dialCode()"
    (ngModelChange)="dialCode.set($event)"
    class="
      shrink-0 w-32
      pl-3 pr-2 py-3
      bg-surface-container-lowest border border-outline-variant
      rounded-lg
      text-sm
      outline-none transition-all focus:ring-2 focus:ring-primary/30 focus:border-primary
    "
  >
    @for (country of countries; track country.dialCode + country.name) {
      <option [value]="country.dialCode">{{ country.flag }} + {{ country.dialCode }}</option>
    }
  </select>

  <input
    type="tel"
    placeholder="Número de celular"
    [ngModel]="phoneNumber()"
    (ngModelChange)="phoneNumber.set($event)"
    class="
      flex-1
      px-4 py-3
      bg-surface-container-lowest border border-outline-variant
      rounded-lg
      text-sm
      outline-none transition-all focus:ring-2 focus:ring-primary/30 focus:border-primary
    "
  />
</div>
