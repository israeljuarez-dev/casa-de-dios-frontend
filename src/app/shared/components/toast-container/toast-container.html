<div class="fixed bottom-6 left-6 z-100 flex flex-col gap-3 w-full max-w-md">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="flex items-center gap-4 px-5 py-4 rounded-2xl shadow-xl border-l-[6px]"
      [class.bg-primary-fixed]="toast.type === 'success'"
      [class.border-primary]="toast.type === 'success'"
      [class.bg-red-50]="toast.type === 'error'"
      [class.border-error]="toast.type === 'error'"
      [class.bg-secondary-container]="toast.type === 'info'"
      [class.border-secondary]="toast.type === 'info'"
    >
      <span
        class="material-symbols-outlined text-2xl shrink-0"
        [class.text-primary]="toast.type === 'success'"
        [class.text-error]="toast.type === 'error'"
        [class.text-secondary]="toast.type === 'info'"
      >
        @switch (toast.type) {
          @case ('success') { check_circle }
          @case ('error') { error }
          @default { info }
        }
      </span>
      <span class="flex-1 text-base font-semibold text-on-surface">{{ toast.message }}</span>
      <button
        type="button"
        (click)="toastService.dismiss(toast.id)"
        class="shrink-0 text-on-surface-variant transition-colors hover:text-error"
      >
        <span class="material-symbols-outlined text-xl">close</span>
      </button>
    </div>
  }
</div>
